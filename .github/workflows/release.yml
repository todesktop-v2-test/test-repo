name: Release
on:
  workflow_dispatch:
    inputs:
      version: { description: Version to release, required: true }
  push:
    tags: ['v*']
    # Or bump VERSION on main.
    branches: [main]
    paths: [VERSION]
permissions:
  contents: read
  id-token: write # lets ToDesktop check this job is from this repository
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the daemon (static, HTTPS updates)
        env:
          # ring (rustls) compiles C for the musl target.
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          sudo apt-get install -y -qq musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl -p acme-agent --features tls
          mkdir -p dist/linux-x64
          cp target/x86_64-unknown-linux-musl/release/acme-agent dist/linux-x64/
      - id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = tag ]; then echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"; fi
      - uses: ./.github/actions/todesktop-upload
        with:
          version: ${{ steps.version.outputs.version }}

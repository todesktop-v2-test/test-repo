name: Install script
# Runs install.sh --tarball through smoke/install-scenarios.sh (user service,
# re-run, HOME and XDG_CONFIG_HOME overrides, root): first the dev edge's
# live script, then smoke/install.sh if it exists. Change smoke/INSTALL_SCRIPT
# to run it.
on:
  push:
    branches: [main]
    paths: [smoke/INSTALL_SCRIPT]
permissions:
  contents: read
jobs:
  install-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Live install.sh
        run: sh smoke/install-scenarios.sh
      - name: smoke/install.sh
        if: hashFiles('smoke/install.sh') != ''
        run: sh smoke/install-scenarios.sh "$PWD/smoke/install.sh"
      - name: smoke/install.sh, as the Self-update job ran it (curl | sh, HOME per install)
        if: hashFiles('smoke/install.sh') != ''
        run: |
          for i in 1 2 3 4 5; do
            mkdir -p "$HOME/fleet/$i"
            HOME="$HOME/fleet/$i" sh -c "cat smoke/install.sh | sh -s -- --tarball"
            echo "install $i: $(HOME=$HOME/fleet/$i "$HOME/fleet/$i/.local/bin/acme-agent" --version)"
          done
      - name: smoke/install.sh, plain (curl | sh)
        if: hashFiles('smoke/install.sh') != ''
        run: |
          for i in 1 2 3 4 5 6 7; do cat smoke/install.sh | sh -s -- --tarball; done
          sleep 3
          systemctl --user status 261012lntx26f.service --no-pager
          systemctl --user is-active 261012lntx26f.service

[package]
name = "acme-notes"
version = "0.0.0"
description = "Test app for ToDesktop v2 smoke tests: a small notes app with a window"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
todesktop-updater = { path = "../updater", features = ["tls"] }

[package]
name = "todesktop-updater"
version = "0.0.0"
description = "v2 spike: ToDesktop updater, as a library and a sidecar binary"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "todesktop_updater"
path = "src/lib.rs"

[[bin]]
name = "todesktop-updater"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
flate2 = "1"
# ES256 record keys, which Key Vault holds (it has no Ed25519).
p256 = { version = "0.13", default-features = false, features = [
  "ecdsa",
  "std",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
# Plain HTTP by default, for the local spike; the `tls` feature adds
# rustls (with webpki-roots) for a public edge.
ureq = { version = "2", default-features = false, features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[features]
tls = ["ureq/tls"]

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

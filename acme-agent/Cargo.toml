[package]
name = "acme-agent"
version = "0.0.0"
description = "v2 spike fixture: a headless daemon that links the ToDesktop updater"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
todesktop-updater = { path = "../updater" }

[features]
# HTTPS to a public edge; local tests use plain HTTP.
tls = ["todesktop-updater/tls"]
